<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Gael Carrillo Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tailwind.css">
  <style>
    .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease-out, transform 0.7s ease-out; }
    .reveal.visible { opacity: 1; transform: translateY(0); }
  </style>
  <link rel="stylesheet" href="navbar.css">
  <script src="navbar.js" defer></script>
</head>
<body class="bg-cream text-brown font-body">

  <div data-navbar></div>

  <section class="pt-40 pb-24 px-4 sm:px-8 bg-beige/30">
    <div class="container mx-auto max-w-3xl">
      <div class="text-center mb-12 reveal">
        <h2 class="text-4xl font-display font-bold mb-6">Get In Touch</h2>
        <p class="text-brown/70 max-w-xl mx-auto">Have a question or want to work together? Send me a message and I'll get back to you.</p>
      </div>

      <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" class="reveal bg-white rounded-2xl p-8 md:p-10 border border-tan/50 shadow-xl space-y-6">
        <input type="hidden" name="access_key" value="9f3f2d0f-07e2-40ce-92d6-2a6ca711dfa4">
        <input type="hidden" name="subject" value="New message from your portfolio">
        <input type="checkbox" name="botcheck" style="display: none !important;" tabindex="-1" autocomplete="off">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm tracking-widest uppercase text-brown/60 mb-2" for="form-name">Name</label>
            <input id="form-name" name="name" type="text" required autocomplete="name" class="w-full px-4 py-3 bg-beige/60 border border-tan rounded-xl focus:outline-none focus:ring-2 focus:ring-terra/50 transition" placeholder="Your name">
          </div>
          <div>
            <label class="block text-sm tracking-widest uppercase text-brown/60 mb-2" for="form-email">Email</label>
            <input id="form-email" name="email" type="email" required autocomplete="email" class="w-full px-4 py-3 bg-beige/60 border border-tan rounded-xl focus:outline-none focus:ring-2 focus:ring-terra/50 transition" placeholder="Your email">
          </div>
        </div>
        <div>
          <label class="block text-sm tracking-widest uppercase text-brown/60 mb-2" for="form-message">Message</label>
          <textarea id="form-message" name="message" rows="5" required class="w-full px-4 py-3 bg-beige/60 border border-tan rounded-xl focus:outline-none focus:ring-2 focus:ring-terra/50 transition resize-none" placeholder="Your message"></textarea>
        </div>
        <div class="flex items-center justify-between flex-wrap gap-4">
          <button type="submit" class="px-8 py-3 bg-terra text-cream font-medium tracking-widest uppercase text-sm rounded-full hover:opacity-90 hover:animate-pulse-slow transition disabled:opacity-50 disabled:cursor-not-allowed">
            Send Message
          </button>
          <p id="form-status" class="text-sm text-brown/60" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>

  <footer class="py-12 px-4 sm:px-8 border-t border-tan">
    <div class="container mx-auto max-w-4xl text-center">
      <p class="text-brown/60 mb-4">Let's connect and build something together.</p>
      <a href="mailto:gcarrillo-torres1@csub.edu" class="text-xl font-medium text-terra hover:opacity-70 transition">gcarrillo-torres1@csub.edu</a>
      <div class="mt-8 pt-8 border-t border-tan/50">
        <p class="text-xs text-brown/50">© 2027 Gael Carrillo. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    const revealElements = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    revealElements.forEach(el => revealObserver.observe(el));

    const contactForm = document.getElementById('contact-form');
    if (contactForm) {
      contactForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const submitBtn = contactForm.querySelector('button[type="submit"]');
        const status = document.getElementById('form-status');
        const data = new FormData(contactForm);
        data.set('subject', 'Portfolio message from ' + data.get('name'));

        if (submitBtn) submitBtn.disabled = true;
        if (status) status.textContent = 'Sending...';

        fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: data
        })
          .then(function (response) {
            if (!response.ok) throw new Error('Request failed');
            if (status) status.textContent = "Message sent! I'll get back to you soon.";
            contactForm.reset();
          })
          .catch(function () {
            if (status) status.textContent = 'Something went wrong. Please try again.';
          })
          .finally(function () {
            if (submitBtn) submitBtn.disabled = false;
          });
      });
    }
  </script>
</body>
</html>
