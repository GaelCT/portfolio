name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Test
        run: make test

      - name: Deploy via rsync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'Makefile' --exclude 'README.md' \
            --exclude 'node_modules' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'tailwind.config.js' --exclude 'src' --exclude '.gitignore' \
            --rsync-path="sudo rsync" \
            ./ ${{ secrets.USER }}@${{ secrets.HOST }}:/var/www/html/ \
          || rsync -avz --delete \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'Makefile' --exclude 'README.md' \
            --exclude 'node_modules' --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'tailwind.config.js' --exclude 'src' --exclude '.gitignore' \
            ./ ${{ secrets.USER }}@${{ secrets.HOST }}:/var/www/html/
